<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stallcart Delivery - Join our Network</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .delivery-hero {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('hero_landscape_boutique_1775116613649.png');
            background-size: cover; background-position: center;
            height: 40vh; display: flex; align-items: center; justify-content: center; text-align: center; color: #fff;
        }
        .delivery-container { max-width: 800px; margin: -50px auto 100px; background: #fff; border-radius: 20px; padding: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.1); position: relative; z-index: 10; }
        .delivery-tabs { display: flex; gap: 20px; margin-bottom: 40px; border-bottom: 2px solid #f0f0f0; }
        .d-tab { padding: 15px 30px; font-weight: 700; cursor: pointer; color: #888; border-bottom: 4px solid transparent; transition: 0.3s; }
        .d-tab.active { color: #2874f0; border-bottom-color: #2874f0; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
        input { width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 8px; outline: none; transition: 0.3s; }
        input:focus { border-color: #2874f0; }
        
        .btn-join { width: 100%; padding: 15px; background: #2874f0; color: #fff; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 16px; box-shadow: 0 10px 20px rgba(40, 116, 240, 0.2); }
        
        .order-card-d { border: 1px solid #eee; border-radius: 15px; padding: 20px; margin-bottom: 20px; background: #fafafa; }
        .order-d-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 15px; }
        .status-badge { padding: 5px 12px; border-radius: 50px; font-size: 12px; font-weight: 700; }
        .s-out { background: #fff8e1; color: #f57f17; }
        .s-delivered { background: #e8f5e9; color: #2e7d32; }
        
        .user-info-box { background: #fff; padding: 15px; border-radius: 10px; border: 1px dashed #ccc; margin-top: 15px; line-height: 1.6; }
        .otp-input-area { display: flex; gap: 10px; margin-top: 20px; align-items: center; }
        .otp-input { width: 100%; text-align: center; font-size: 20px; letter-spacing: 5px; }

        @media (max-width: 600px) {
            .delivery-hero { height: 25vh; }
            .delivery-hero h1 { font-size: 24px !important; }
            .delivery-container { margin: -20px 10px 50px; padding: 20px; border-radius: 12px; }
            .d-tab { padding: 10px 15px; font-size: 13px; }
            .order-card-d { padding: 15px; }
            .otp-input-area { gap: 15px; }
            .btn-join { font-size: 14px; padding: 12px; }
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="logo-box">
             <a href="index.html" class="logo">Stallcart</a>
        </div>
    </header>

    <div class="delivery-hero">
        <div>
            <h1 style="font-size: 48px; font-weight: 900;">BECOME A DELIVERY PARTNER</h1>
            <p style="font-size: 18px; margin-top: 15px; opacity: 0.9;">Deliver smiles, earn rewards with Stallcart India.</p>
        </div>
    </div>

    <div class="delivery-container">
        <div class="delivery-tabs">
            <div class="d-tab active" id="tabJoin">JOIN NETWORK</div>
            <div class="d-tab" id="tabStatus">MY TASKS</div>
        </div>

        <!-- Join Form -->
        <div id="joinSection">
            <h3 style="margin-bottom: 20px; font-weight: 800; color: #212121;">Create Partner Profile</h3>
            <form id="joinForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="joinName" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label>Mobile Number</label>
                    <input type="tel" id="joinPhone" placeholder="Enter 10-digit mobile number" required pattern="[0-9]{10}">
                </div>
                <div class="form-group">
                    <label>Resident Address</label>
                    <textarea id="joinAddress" style="width: 100%; height: 100px; padding: 12px; border: 2px solid #eee; border-radius: 8px; outline: none; transition: 0.3s; font-family: inherit;" placeholder="Enter your full home address" required></textarea>
                </div>
                <div class="form-group">
                    <label>Aadhar or ID Card Number</label>
                    <input type="text" id="joinId" placeholder="Enter ID Proof Number" required>
                </div>
                <p style="font-size: 12px; color: #888; margin-bottom: 25px;">By joining, you agree to follow Stallcart's safety and delivery protocols.</p>
                <button type="submit" class="btn-join">SUBMIT APPLICATION</button>
            </form>
        </div>

        <!-- Tasks Section -->
        <div id="statusSection" style="display: none;">
            <div style="margin-bottom: 30px;">
                <label>Enter Registered Mobile to Track Tasks</label>
                <div style="display: flex; gap: 10px;">
                    <input type="tel" id="trackPhone" placeholder="9876543210">
                    <button class="btn-join" id="btnTrack" style="width: auto; padding: 12px 25px;">LOGIN</button>
                </div>
            </div>
            <div id="tasksList">
                <div style="text-align: center; padding: 40px; color: #999;">
                    <i class="fa fa-clipboard-list" style="font-size: 40px; margin-bottom: 10px;"></i>
                    <p>Enter your phone number to see assigned deliveries.</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="delivery.js"></script>
</body>
</html>
